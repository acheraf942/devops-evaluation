groups:
  - name: app_alerts
    rules:
      - alert: TauxErreur5xxEleve
        expr: |
          sum(rate(http_requests_total{code=~"5.."}[2m]))
          /
          sum(rate(http_requests_total[2m]))
          > 0.05
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Taux d'erreurs 5xx superieur a 5%"
          description: "Plus de 5% des requetes echouent en 5xx depuis 30 secondes."

      - alert: LatenceP95Elevee
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(http_request_duration_seconds_bucket[5m]))
          ) > 1
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Latence p95 superieure a 1 seconde"
          description: "95% des requetes prennent plus d'1 seconde a repondre depuis 1 minute."