name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environnement cible"
        required: true
        default: "production"
        type: choice
        options:
          - production

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    outputs:
      sha_tag: ${{ steps.tags.outputs.sha_tag }}
      semver_tag: ${{ steps.tags.outputs.semver_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Calculer les tags
        id: tags
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "sha_tag=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "semver_tag=v1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Connexion a ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire et pousser l'image
        uses: docker/build-push-action@v6
        with:
          context: ./starter-app
          push: true
          build-args: |
            APP_VERSION=${{ steps.tags.outputs.sha_tag }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.tags.outputs.sha_tag }}
            ${{ env.IMAGE }}:${{ steps.tags.outputs.semver_tag }}
