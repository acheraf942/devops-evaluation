name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-python-app
        with:
          python-version: "3.12"

      - name: Verifier le style avec flake8
        working-directory: starter-app
        run: flake8 . --max-line-length=100 --exclude=.venv

  test:
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      REDIS_HOST: localhost
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-python-app
        with:
          python-version: ${{ matrix.python-version }}

      - name: Lancer les tests avec couv
        working-directory: starter-app
        run: pytest -v --junitxml=report.xml --cov=. --cov-report=xml

      - name: rapports de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-py${{ matrix.python-version }}
          path: |
            starter-app/report.xml
            starter-app/coverage.xml

  build:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Construire l'image sans push
        run: docker build -t devops-evaluation-web:ci ./starter-app

  ci-ok:
    runs-on: ubuntu-latest
    needs: [lint, test, build]
    timeout-minutes: 2
    steps:
      - name: Tout est vert
        run: echo "lint, test et build ont reussi."
